<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061329" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/expensenest-mark-512.png" />
    <link rel="apple-touch-icon" href="/brand/expensenest-mark-192.png" />
    <title>ExpenseNest - Expense Tracker</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('expenseNestTheme');
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
